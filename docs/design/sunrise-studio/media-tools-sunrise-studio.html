<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Tools: combined direction</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--foreground,#1c1c1e)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.ctl button{padding:0 13px;min-height:36px;border-radius:18px;font-size:13.5px;font-weight:600;border:1px solid var(--border,#ccc)}.ctl button.on{background:var(--foreground,#1c1c1e);color:var(--background,#fff);border-color:transparent}
.wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;margin-top:12px}.side{flex:1 1 280px;min-width:0;font-size:14px;line-height:1.45}.side h2{margin:0 0 4px;font-size:21px}.side p{margin:0 0 10px}.side dl{margin:0;display:grid;gap:9px}.side dt{font-weight:650;font-size:12.5px}.side dd{margin:0}.mut{color:var(--muted-foreground,#666)}
.phone{width:300px;height:640px;flex:none;border-radius:42px;background:var(--bg);color:var(--ink);position:relative;overflow:hidden;box-shadow:0 0 0 7px #16171a,0 0 0 8px #3a3b3f;margin:8px;font-size:14px;line-height:1.3}
.light{--bg:#FFF7EF;--s1:#fff;--s2:#F6E9DD;--ink:#2A1A13;--mut:#6E5B50;--line:#F0E2D5;--a:#C9441E;--ai:#fff;--at:#C2401B;--tab:#FFFBF7;--warn:#B85F00;--warnbg:#FFEBD0;--off:#E5D5C7;--w1:#E8892B;--w2:#C2401B;--grad:linear-gradient(135deg,#D2501F,#AE2733)}
.dark{--bg:#15110F;--s1:#231C18;--s2:#30271F;--ink:#FBF0E7;--mut:#B9A99C;--line:#2F2620;--a:#FF8F5E;--ai:#2A1209;--at:#FF9B6E;--tab:#1B1613;--warn:#FFB65C;--warnbg:#38280F;--off:#4A3D33;--w1:#FFB347;--w2:#FF6B4A;--grad:linear-gradient(135deg,#D2501F,#9E2230)}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:6px 26px 0;font-size:13px;font-weight:650;flex:none}.island{width:78px;height:22px;border-radius:12px;background:#000}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}.scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding:0 16px 14px}.scroll::-webkit-scrollbar{display:none}
.ind{position:absolute;bottom:6px;left:50%;width:104px;height:4px;margin-left:-52px;border-radius:2px;background:var(--ink);opacity:.85;pointer-events:none;z-index:9}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.h{font-family:"SF Pro Rounded",ui-rounded,-apple-system,sans-serif;font-weight:800;letter-spacing:-.015em}.top{display:flex;justify-content:space-between;align-items:center;min-height:40px}.tb{display:flex;color:var(--at);font-size:21px}.tb button{width:40px;height:40px;display:grid;place-items:center}
.search{display:flex;gap:7px;align-items:center;height:36px;border-radius:11px;padding:0 10px;background:var(--s2);color:var(--mut);margin:6px 0 9px}.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 4px;padding:0 16px}.chips::-webkit-scrollbar{display:none}.chip{flex:none;padding:6px 12px;border-radius:15px;background:var(--s2);font-size:12.5px;font-weight:600;color:var(--mut)}.chip.on{background:var(--a);color:var(--ai)}
.sec{font-size:12px;font-weight:650;color:var(--mut);margin:12px 0 6px}.tabs{height:66px;flex:none;display:flex;padding:7px 6px 0;background:var(--tab);border-top:1px solid var(--line);position:relative;z-index:3}.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--mut);min-width:0}.tabs button svg{font-size:21px}.tabs button.on{color:var(--at)}
.t{font-weight:650;font-size:14.5px;line-height:1.22}.sum{color:var(--mut);font-size:12.5px;line-height:1.32;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:11.5px;color:var(--mut);margin-top:4px;display:flex;align-items:center;gap:5px}.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace}.dot{width:7px;height:7px;border-radius:50%;flex:none}.spin{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--at);animation:sp .9s linear infinite}@keyframes sp{to{transform:rotate(1turn)}}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:0 13px;min-height:32px;border-radius:16px;background:var(--a);color:var(--ai);font-weight:650;font-size:12.5px}.ghost{background:var(--s2);color:var(--ink)}.attn{display:flex;gap:9px;align-items:center;padding:10px 11px;border-radius:13px;background:var(--warnbg);margin-bottom:7px}.attn svg{color:var(--warn);font-size:18px}.g{flex:1;min-width:0}
.card{background:var(--s1);border-radius:18px;padding:12px;margin-bottom:8px;display:block;width:100%}.row{display:flex;gap:10px;width:100%;padding:11px 0;border-bottom:1px solid var(--line)}.tile{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:none;color:#fff}.bars{display:flex;align-items:center;gap:1.5px}.bars i{display:block;width:2px;border-radius:1px;flex:none}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.42);z-index:5;display:flex;align-items:flex-end}.sheet{background:var(--bg);width:100%;border-radius:20px 20px 0 0;padding:14px 16px 26px}.opt{display:flex;gap:12px;align-items:center;width:100%;min-height:48px;font-size:15px;font-weight:550;border-bottom:1px solid var(--line)}.opt svg{font-size:20px;color:var(--at)}
.back{display:flex;gap:3px;align-items:center;color:var(--at);font-size:14.5px;min-height:40px}.seg{display:flex;background:var(--s2);border-radius:10px;padding:2px;margin:12px 0}.seg button{flex:1;text-align:center;padding:6px;font-size:12.5px;font-weight:600;border-radius:8px;color:var(--mut)}.seg .on{background:var(--s1);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}.play{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--a);color:var(--ai);font-size:17px}.ask{position:absolute;bottom:22px;left:16px;right:16px;min-height:46px;border-radius:23px;background:var(--a);color:var(--ai);font-weight:650;display:flex;gap:7px;align-items:center;justify-content:center;box-shadow:0 5px 16px rgba(0,0,0,.25);z-index:3}
.rec{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 22px 44px}.lab{display:flex;gap:6px;align-items:center;font-weight:650;font-size:13px;margin-top:14px}.rd{width:9px;height:9px;border-radius:50%;background:#fff;animation:pu 1.6s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.ctrls{display:flex;gap:30px;margin-top:auto;align-items:center}.cb{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:24px}.live i{animation:wv 1.1s ease-in-out infinite alternate}@keyframes wv{to{transform:scaleY(.45)}}
.set{background:var(--s1);border-radius:14px;margin-bottom:12px}.set div{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 12px;border-bottom:1px solid var(--line)}.set div:last-child{border:0}.set b{flex:1;font-weight:500}.set span{color:var(--mut);font-size:12.5px}.set .ti{width:28px;height:28px;border-radius:8px;background:var(--s2);color:var(--at);display:grid;place-items:center;font-size:15px}
.vm{position:absolute;inset:0;background:#000;color:#fff}.vt{padding:58px 18px 0;font-size:25px;font-weight:700}.vr{padding:12px 18px;border-bottom:1px solid #2b2b2e;color:#aaa;font-size:13px}.shc{position:absolute;left:0;right:0;bottom:0;background:var(--s1);color:var(--ink);border-radius:22px 22px 0 0;padding:16px 18px 30px}.pbar{height:6px;border-radius:3px;background:var(--s2);overflow:hidden;margin:13px 0 6px}.pbar i{display:block;height:100%;width:64%;background:var(--grad)}
.gal{display:flex;flex-wrap:wrap;gap:22px 26px;justify-content:center}.gal h3{margin:2px 0 8px 10px;font-size:15px}.ic{border-radius:22.5%;display:block}
@media (prefers-reduced-motion:reduce){.spin,.rd,.live i{animation:none}}
</style></head><body><div id="app"></div>
<script>
const P={mic:'<path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',plus:'<path d="M12 5v14M5 12h14"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.7a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 2 1.2l.4 2.7h4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',link:'<path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1"/><path d="M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/>',file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',wave:'<path d="M3 11v2M7 8v8M11 4v16M15 8v8M19 11v2"/>',folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',home:'<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/>',lib:'<path d="M5 5h14M5 12h14M5 19h9"/>',left:'<path d="m15 5-7 7 7 7"/>',right:'<path d="m9 5 7 7-7 7"/>',play:'<path d="M7 4v16l13-8Z" fill="currentColor"/>',pause:'<path d="M8 5v14M16 5v14" stroke-width="3.2"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>',spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/><path d="M19 16v4M17 18h4"/>',share:'<path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>',more:'<circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/>',alert:'<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>',check:'<path d="m5 12 5 5 9-10"/>',bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4Z"/><path d="M10 21h4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 8-8M16 7l3 3"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>'};
const I=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
// Each bar blends from amber to coral across the recording.
const bars=(s,n,h,played=1,w=2)=>{let o='';for(let k=0;k<n;k++){const v=Math.abs(Math.sin(s*1.7+k*.9)*Math.cos(s+k*.37)),p=k/(n-1),c=k/n<played?`color-mix(in srgb,var(--w2) ${Math.round(p*100)}%,var(--w1))`:'var(--off)';o+=`<i style="height:${Math.max(3,Math.round(v*h))}px;width:${w}px;background:${c}"></i>`}return o};
const C={Baby:'#D9542E',Work:'#0A7C86',Ideas:'#8A5AB5',Calls:'#B8780A'};
const ITEMS=[{id:0,t:'Recording, Nov 5 at 7:57 AM',busy:1,when:'7:57 AM',k:'wave',sec:'Today'},{id:1,t:'Hafa Baby updates',dur:'8:36',when:'7:59 PM',c:'Baby',k:'wave',sec:'Yesterday',s:'What changed this week, what is still open, and what to test before the next round.'},{id:2,t:'Baby Shimizu App',dur:'5:20',when:'9:30 PM',c:'Baby',k:'wave',sec:'Oct 19',s:'Ideas for the first version and what it needs to do on day one.'},{id:3,t:'Planning call',dur:'42:10',when:'4:40 PM',c:'Work',k:'wave',sec:'Oct 17',s:'Launch moves to the 18th so QA can run a full week. Split QA between two people.'},{id:4,t:'How to read a contract',dur:'14:02',when:'11:15 AM',c:'Ideas',k:'link',sec:'Oct 12',src:'YouTube',s:'The clauses to read first, and the ones people usually skip.'},{id:5,t:'Lease agreement',dur:'18 pages',when:'9:02 AM',c:'Work',k:'file',sec:'Oct 9',src:'PDF',s:'Term, renewal dates and who pays for repairs.'}];
const COLS=[['Baby',12],['Work',48],['Ideas',31],['Calls',27]];
let st={m:'dark',s:'home',add:false,tr:false};
const stat=()=>`<div class="status"><span>7:57</span><span class="island"></span><span>5G 96%</span></div>`;
const tb=(s,l,i,on)=>`<button data-s="${s}" class="${on==s?'on':''}">${I(i)}${l}</button>`;
const tabs=on=>`<div class="tabs">${tb('home','Home','home',on)}${tb('lib','Library','lib',on)}<button data-s="rec" aria-label="Record" style="flex:1.05;margin-top:-22px"><span style="width:56px;height:56px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:25px;box-shadow:0 0 0 5px var(--bg)">${I('mic')}</span></button>${tb('coll','Collections','folder',on)}${tb('set','Settings','gear',on)}</div>`;
const attn=()=>`<div class="attn">${I('alert')}<div class="g"><div class="t" style="font-size:13.5px;white-space:nowrap">Aug 26 recording</div><div class="meta" style="margin-top:1px;white-space:nowrap">1:29:12, not sent yet</div></div><button class="btn">Transcribe</button></div><div class="attn">${I('alert')}<div class="g"><div class="t" style="font-size:13.5px;white-space:nowrap">Aug 21 recording</div><div class="meta" style="margin-top:1px;white-space:nowrap">28:25, did not save fully</div></div><button class="btn ghost">Options</button></div>`;
const tag=x=>x.c?`<span class="dot" style="background:${C[x.c]}"></span>${x.c}`:'';
const card=x=>`<button class="card" data-s="detail"><div style="display:flex;justify-content:space-between;gap:8px"><div class="t h" style="font-weight:700">${x.t}</div><span class="meta" style="margin:1px 0 0;flex:none">${x.when}</span></div>${x.s?`<div class="sum">${x.s}</div>`:''}<div class="meta">${x.busy?'<span class="spin"></span>Transcribing':`${tag(x)} &middot; ${x.dur}`}</div></button>`;
const home=()=>`${stat()}<div class="scroll"><div class="top" style="margin-top:2px"><div><div style="font-size:12px;font-weight:600;color:var(--mut)">Thursday, Nov 5</div><div class="h" style="font-size:27px">Good morning</div></div></div><button data-s="rec" style="display:flex;align-items:center;gap:13px;width:100%;margin:11px 0;padding:15px;border-radius:21px;background:var(--grad);color:#fff"><span style="width:58px;height:58px;border-radius:50%;background:#fff;color:#B5352A;display:grid;place-items:center;font-size:27px;flex:none">${I('mic')}</span><span><span class="h" style="display:block;font-size:21px">Record</span><span style="font-size:12.5px;font-weight:550">Tap here or press your Action Button</span></span></button><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:6px">${[['wave','Import'],['link','Link'],['file','PDF']].map(a=>`<button data-add style="background:var(--s1);border-radius:14px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:650"><span style="font-size:20px;color:var(--at)">${I(a[0])}</span>${a[1]}</button>`).join('')}</div><div class="sec">Needs you</div>${attn()}<div class="sec">Recent</div>${ITEMS.slice(0,3).map(card).join('')}</div>${tabs('home')}`;
const row=x=>{const vis=x.k=='wave'?`<span class="bars" style="width:64px;height:40px;overflow:hidden">${x.busy?bars(x.id+2,16,32,0):bars(x.id+2,16,32)}</span>`:`<span class="tile" style="background:var(--s2);color:var(--at);width:64px">${I(x.k)}</span>`;return `<button class="row" data-s="detail">${vis}<span class="g"><span style="display:flex;justify-content:space-between;gap:7px"><span class="t" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.t}</span>${x.dur?`<span class="mono" style="font-size:11.5px;color:var(--mut);flex:none;margin-top:2px">${x.dur.replace(' pages','p')}</span>`:''}</span>${x.s?`<span class="sum">${x.s}</span>`:''}<span class="meta">${x.busy?'<span class="spin"></span>Transcribing':`${tag(x)} &middot; ${x.src?x.src+' &middot; ':''}${x.sec}`}</span></span></button>`};
const lib=()=>`${stat()}<div class="scroll"><div class="top"><div class="h" style="font-size:29px">Library</div><div class="tb"><button data-add aria-label="Add">${I('plus')}</button></div></div><div class="search">${I('search')}Search transcripts and summaries</div><div class="chips"><span class="chip on">All 146</span><span class="chip">Recordings</span><span class="chip">Links</span><span class="chip">PDFs</span><span class="chip">Starred</span></div>${ITEMS.map(row).join('')}</div>${tabs('lib')}`;
const coll=()=>`${stat()}<div class="scroll"><div class="top"><div class="h" style="font-size:29px">Collections</div><div class="tb"><button aria-label="New collection">${I('plus')}</button></div></div><p style="color:var(--mut);font-size:13px;margin:4px 0 8px">Group recordings, then ask questions across everything in the group.</p>${COLS.map(c=>`<button class="row"><span class="tile" style="background:${C[c[0]]}">${I('folder')}</span><span class="g"><span class="t">${c[0]}</span><span class="meta mono" style="margin-top:2px">${c[1]} items</span></span><span style="color:var(--mut);align-self:center">${I('right')}</span></button>`).join('')}</div>${tabs('coll')}`;
const sett=()=>{const g=r=>`<div class="set">${r.map(x=>`<div><span class="ti">${I(x[0])}</span><b>${x[1]}</b><span>${x[2]||I('right')}</span></div>`).join('')}</div>`;return `${stat()}<div class="scroll"><div class="top"><div class="h" style="font-size:29px">Settings</div></div><div style="height:8px"></div>${g([['wave','Auto-transcribe','On'],['bell','Completion alerts','On'],['mic','Quick Record','Action Button']])}<div class="card" style="padding:13px"><div style="display:flex;justify-content:space-between;font-weight:600"><span>This month</span><span class="mono" style="font-size:12.5px;color:var(--mut)">36 of 300 min</span></div><div class="pbar" style="margin:9px 0 0"><i style="width:12%"></i></div></div>${g([['user','Account'],['key','Devices and passkeys'],['spark','AI processing'],['link','Developer and agent keys'],['help','Help']])}</div>${tabs('set')}`};
const rec=()=>`<div style="position:absolute;inset:0;display:flex;flex-direction:column;background:var(--grad);color:#fff">${stat()}<div class="rec"><div class="lab"><span class="rd"></span>Recording</div><div class="h" style="font-size:58px;margin:24px 0 8px;font-variant-numeric:tabular-nums">00:42</div><div style="font-weight:600">New recording</div><div style="font-size:12.5px;margin-top:2px">Thursday, Nov 5, 7:57 AM</div><div class="bars live" style="gap:3px;height:96px;margin-top:34px;--w1:#fff;--w2:#fff">${bars(5,32,88,1,3)}</div><div class="ctrls"><button class="cb" data-s="home" aria-label="Pause" style="background:rgba(255,255,255,.2)">${I('pause')}</button><button class="cb" data-s="detail" aria-label="Stop" style="width:78px;height:78px;background:#fff;color:#B5352A;font-size:30px">${I('stop')}</button></div><div style="font-size:11.5px;margin-top:14px">Press the Action Button again to stop</div></div></div>`;
const det=()=>{const x=ITEMS[1];const body=st.tr?[['0:00','Okay, quick update on where everything stands this week.'],['0:12','The first thing is the sign-in, which is working now.'],['0:31','What is still open is the share screen and how it looks.'],['2:14','Before the next round I want to test the Action Button again.']].map((l,k)=>`<p style="margin:0 0 10px;line-height:1.45;${k==3?'background:var(--s2);margin:0 -7px 10px;padding:5px 7px;border-radius:7px':''}"><span class="mono" style="font-size:11.5px;color:var(--at);display:block">${l[0]}</span>${l[1]}</p>`).join(''):`<div style="font-size:14.5px;line-height:1.48">What changed this week, what is still open, and what to test before the next round.</div><div class="sec" style="margin-top:14px">Key points</div>${['Sign-in now works without a password prompt.','The share screen still needs a design pass.','Test the Action Button again next round.'].map(p=>`<div style="display:flex;gap:7px;font-size:13.5px;line-height:1.38;margin-bottom:7px"><span style="color:var(--at);margin-top:2px">${I('check')}</span><span>${p}</span></div>`).join('')}`;
 return `${stat()}<div class="scroll" style="padding-bottom:78px"><div class="top"><button class="back" data-s="lib">${I('left')}Library</button><div class="tb" style="font-size:19px"><button aria-label="Share">${I('share')}</button><button aria-label="More">${I('more')}</button></div></div><div class="h" style="font-size:25px;line-height:1.14;margin-top:2px">${x.t}</div><div class="meta" style="margin-top:6px">${tag(x)} &middot; Yesterday, 7:59 PM</div><div class="card" style="margin-top:12px"><div class="bars" style="height:58px;gap:2px;overflow:hidden">${bars(4,62,52,.26)}</div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px"><span class="mono" style="font-size:12px">2:14</span><span class="play">${I('play')}</span><span class="mono" style="font-size:12px;color:var(--mut)">8:36</span></div></div><div class="seg"><button data-tr="0" class="${st.tr?'':'on'}">Summary</button><button data-tr="1" class="${st.tr?'on':''}">Transcript</button></div>${body}</div><button class="ask">${I('spark')}Ask about this</button>`};
const icon=s=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100" class="ic" role="img" aria-label="App icon"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59A3C"/><stop offset=".55" stop-color="#DC4F22"/><stop offset="1" stop-color="#AE2733"/></linearGradient></defs><rect width="100" height="100" fill="url(#g1)"/><g stroke="#fff" stroke-width="7.5" stroke-linecap="round"><path d="M22 66v-8M36 66V44M50 66V30M64 66V44M78 66v-8"/></g><path d="M14 78h72" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>`;
const share=()=>`<div class="vm"><div class="vt">All Recordings</div><div class="vr">New Recording 42<br>Today, 7:58 AM</div><div class="vr">Call v2.1<br>Yesterday</div></div><div class="shc"><div style="display:flex;gap:11px;align-items:center">${icon(46)}<div class="g"><div class="h" style="font-size:18px">Sending to Media Tools</div><div class="meta" style="margin-top:2px">New Recording 42, 3:12</div></div></div><div class="pbar"><i></i></div><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-weight:550"><span>Uploading</span><span class="mono">64%</span></div><p style="font-size:13.5px;margin:12px 0 13px;line-height:1.38">You can close this. It keeps going, and you will get an alert when the transcript is ready.</p><button class="btn" style="width:100%;min-height:46px;border-radius:23px;font-size:15px">Done</button></div>`;
const S={home,lib,coll,set:sett,rec,detail:det,share};
const addS=()=>`<div class="sheetbg" data-close><div class="sheet" onclick="event.stopPropagation()"><div class="h" style="font-size:18px;margin-bottom:6px">Add to your library</div>${[['wave','Import audio'],['link','Add a link'],['file','Upload a PDF']].map(a=>`<button class="opt">${I(a[0])}${a[1]}</button>`).join('')}</div></div>`;
const phone=s=>`<div class="phone ${st.m}"><div class="screen">${S[s]()}</div>${st.add?addS():''}<div class="ind"></div></div>`;
const NAMES=[['home','Home'],['lib','Library'],['detail','Recording'],['coll','Collections'],['set','Settings'],['rec','Recording now'],['share','Share screen']];
function draw(){const a=document.getElementById('app');if(location.hash.startsWith('#gallery')){st.m=location.hash.split('=')[1]||'dark';a.innerHTML=`<div class="gal">${NAMES.map(n=>`<div><h3>${n[1]}</h3>${phone(n[0])}</div>`).join('')}</div>`;return}
 a.innerHTML=`<div class="ctl">${NAMES.map(x=>`<button data-s="${x[0]}" class="${st.s==x[0]?'on':''}">${x[1]}</button>`).join('')}<button data-m="${st.m=='dark'?'light':'dark'}">${st.m=='dark'?'Show light':'Show dark'}</button></div><div class="wrap">${phone(st.s)}<div class="side"><div style="margin-bottom:12px">${icon(64)}</div><h2>Sunrise Home, Studio Library</h2><dl><div><dt>From Sunrise</dt><dd>Home, the warm palette, rounded type, the recording screen, the share screen, and the icon.</dd></div><div><dt>From Studio</dt><dd>Library rows with waveforms and summaries, filter chips, monospaced numbers, and the waveform player. The lime is now amber to coral.</dd></div><div><dt>Collections and Settings</dt><dd>Follow the Library: the same rows, numbers and spacing.</dd></div><div><dt>Changed to join them</dt><dd>Search moved into Library, because this bar has no Search tab. The middle Record button stays on every tab, so you can record from anywhere.</dd></div></dl><p class="mut" style="margin-top:12px;font-size:12.5px">Tap inside the phone. Your titles are real. Summaries, collections and transcript text are samples.</p></div></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-m],[data-s],[data-add],[data-tr],[data-close]');if(!b)return;const d=b.dataset;if(d.m)st.m=d.m;else if(d.s){st.s=d.s;st.add=false;st.tr=false}else if('add' in d)st.add=true;else if(d.tr)st.tr=d.tr=='1';else if('close' in d)st.add=false;draw()});
draw();
</script></body></html>
