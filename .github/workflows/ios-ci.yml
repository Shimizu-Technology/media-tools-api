name: iOS CI

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
      - 'scripts/gate.sh'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
      - 'scripts/gate.sh'

permissions:
  contents: read

jobs:
  test:
    name: SwiftUI build and tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project ios/MediaTools/MediaTools.xcodeproj
          -scheme MediaTools
          -resolvePackageDependencies

      - name: Create iOS simulator
        run: |
          simulator_id="$(xcrun simctl create \
            'Media Tools CI' \
            'com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro' \
            'com.apple.CoreSimulator.SimRuntime.iOS-18-5')"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b

      - name: Build and test
        run: >-
          xcodebuild
          -project ios/MediaTools/MediaTools.xcodeproj
          -scheme MediaTools
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath '${{ runner.temp }}/MediaToolsDerivedData'
          -resultBundlePath '${{ runner.temp }}/MediaToolsTests.xcresult'
          -only-testing:MediaToolsTests
          -parallel-testing-enabled NO
          test
          CODE_SIGNING_ALLOWED=NO

      - name: Verify simulator installation and launch
        run: |
          app_path="${{ runner.temp }}/MediaToolsDerivedData/Build/Products/Debug-iphonesimulator/MediaTools.app"
          bundle_id="$(plutil -extract CFBundleIdentifier raw "$app_path/Info.plist")"
          test "$bundle_id" = "com.ShimizuTechnology.MediaTools"
          xcrun simctl install "$SIMULATOR_ID" "$app_path"
          xcrun simctl launch --terminate-running-process "$SIMULATOR_ID" "$bundle_id"
          xcrun simctl terminate "$SIMULATOR_ID" "$bundle_id"

      - name: Upload test result on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MediaToolsTests-xcresult
          path: '${{ runner.temp }}/MediaToolsTests.xcresult'
          retention-days: 7
