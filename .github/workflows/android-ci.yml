name: Android CI

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
      - 'scripts/android-release-preflight.sh'
      - 'scripts/gate.sh'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
      - 'scripts/android-release-preflight.sh'
      - 'scripts/gate.sh'

permissions:
  contents: read

jobs:
  test:
    name: Compose lint, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Verify Play release source
        run: ./scripts/android-release-preflight.sh

      - name: Lint, test, and assemble
        working-directory: android
        env:
          CI: 'true'
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleDebug

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 7
