          schema: {type: string, enum: [active, pending, processing, completed, failed]}
      responses: {"200": {description: Paginated library items}}
  /library/stats:
    get:
      tags: [Library]
      summary: Get exact workspace media counts
      responses: {"200": {description: Library statistics}}
  /library/items/{type}/{id}/preferences:
    parameters:
      - {name: type, in: path, required: true, schema: {type: string, enum: [transcript, audio, pdf]}}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Library]
      summary: Get tags, starred state, and archive state for an item
      responses: {"200": {description: Library item preferences}}
    patch:
      tags: [Library]
      summary: Update tags, starred state, or archive state for an item
      responses: {"200": {description: Updated library item preferences}}
  /library/items/{type}/{id}/segments:
    parameters:
      - {name: type, in: path, required: true, schema: {type: string, enum: [transcript, audio, pdf]}}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Library]
      summary: List timestamped or page-backed source evidence for an item
      responses:
        "200":
          description: Ordered source evidence
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/MediaSegment"}
  /webhooks:
    get:
      tags: [Webhooks]
      summary: List webhooks for the current principal
      responses: {"200": {description: Webhooks}}
    post:
      tags: [Webhooks]
      summary: Register a webhook
      responses: {"201": {description: Webhook and one-time secret}}
  /webhooks/deliveries:
    get:
      tags: [Webhooks]
      summary: List recent webhook deliveries
      responses: {"200": {description: Webhook deliveries}}
  /webhooks/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [Webhooks]
      summary: Enable or disable a webhook
      responses: {"200": {description: Webhook updated}}
    delete:
      tags: [Webhooks]
      summary: Delete a webhook
      responses: {"200": {description: Webhook deleted}}
  /ai-content-reports:
    post:
      tags: [Safety]
      summary: Report an owned AI response or summary
      description: Saves a server-selected snapshot of the reported AI output without attaching separate source media or text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id, category]
              properties:
                target_type: {type: string, enum: [chat_message, transcript_summary, audio_summary]}
                target_id: {type: string, format: uuid}
                category: {type: string, enum: [dangerous, hate_or_harassment, sexual, privacy, deceptive, other]}
                details: {type: string, maxLength: 1000}
      responses:
        "201": {description: Report created}
        "200": {description: Output was already reported by this actor}
        "404": {description: Owned reportable output not found}
  /ops/audio/health:
    get:
      tags: [Operations]
      summary: Get owner-only audio pipeline health
      responses: {"200": {description: Audio operations health}, "403": {description: Owner access required}}
  /ops/ai-content-reports:
    get:
      tags: [Operations, Safety]
      summary: List owner-only AI output moderation reports
      responses:
        "200":
          description: Moderation queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/AIContentReport"}
        "403": {description: Owner access required}
  /ops/ai-content-reports/{id}:
    patch:
      tags: [Operations, Safety]
      summary: Record an owner moderation disposition
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [reviewing, resolved, dismissed]}
                admin_note: {type: string, maxLength: 1000}
      responses:
        "200":
          description: Updated moderation report
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AIContentReport"}
        "403": {description: Owner access required}
