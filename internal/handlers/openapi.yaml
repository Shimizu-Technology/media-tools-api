openapi: "3.0.3"
info:
  title: Media Tools API
  description: |
    A Go-powered media workspace API for video transcripts, recording transcription,
    PDF extraction, collections, chat, webhooks, and AI summaries.

    ## Authentication
    Protected endpoints accept either an `X-API-Key` header or a Clerk/legacy bearer token.

    ## Rate Limiting
    Each API key has a per-hour rate limit (default: 100 requests/hour).
    Check `X-RateLimit-Limit` and `X-RateLimit-Remaining` response headers.
  version: "1.0.0"
  contact:
    name: Shimizu Technology
    url: https://github.com/Shimizu-Technology/media-tools-api

servers:
  - url: /api/v1
    description: API v1

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication. Create one via POST /api/v1/keys.

  schemas:
    Transcript:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        youtube_url:
          type: string
          example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        youtube_id:
          type: string
          example: "dQw4w9WgXcQ"
        title:
          type: string
          example: "Never Gonna Give You Up"
        channel_name:
          type: string
          example: "Rick Astley"
        duration:
          type: integer
          description: Duration in seconds
          example: 212
        language:
          type: string
          example: "en"
        transcript_text:
          type: string
          example: "We're no strangers to love..."
        word_count:
          type: integer
          example: 1543
        status:
          type: string
          enum: [pending, processing, completed, failed]
          example: "completed"
        error_message:
          type: string
          example: ""
        batch_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Summary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transcript_id:
          type: string
          format: uuid
        model_used:
          type: string
          example: "openai/gpt-4o-mini"
        summary_text:
          type: string
        key_points:
          type: array
          items:
            type: string
        length:
          type: string
          enum: [short, medium, detailed]
        style:
          type: string
          enum: [bullet, narrative, academic]
        status:
          type: string
          enum: [pending, processing, completed, failed]
        error_message:
          type: string
        created_at:
          type: string
          format: date-time

    ChatSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transcript_id:
          type: string
          format: uuid
          nullable: true
        item_type:
          type: string
          enum: [transcript, audio, pdf]
        item_id:
          type: string
          format: uuid
        api_key_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChatMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        model_used:
          type: string
          example: "openai/gpt-4o-mini"
        created_at:
          type: string
          format: date-time

    ChatResponse:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/ChatSession"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"

    Batch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, processing, completed, failed]
        total_count:
          type: integer
          example: 5
        completed_count:
          type: integer
          example: 3
        failed_count:
          type: integer
          example: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    APIKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key_prefix:
          type: string
          example: "mta_a1b2..."
        name:
          type: string
          example: "my-app"
        active:
          type: boolean
        rate_limit:
          type: integer
          example: 100
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: integer

    PaginatedTranscripts:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Transcript"
        page:
          type: integer
        per_page:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        version:
          type: string
          example: "1.0.0"
        database:
          type: string
          example: "healthy"
        workers:
          type: integer
          example: 3
        yt_dlp_cookies_configured:
          type: boolean
          example: true

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns API health status including database connectivity and worker count.
      security: []
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: "ok"
                version: "1.0.0"
                database: "healthy"
                workers: 3
                yt_dlp_cookies_configured: true

  /keys:
    post:
      tags: [API Keys]
      summary: Create a new API key
      description: |
        Generates a new API key. The raw key is only shown once in the response -- save it!
        In production this endpoint requires `X-Admin-Key`; in local development it can be left open for bootstrapping.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "my-app"
                rate_limit:
                  type: integer
                  example: 200
                  description: Requests per hour (default 100)
            example:
              name: "my-app"
              rate_limit: 200
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIKey"
                  - type: object
                    properties:
                      raw_key:
                        type: string
                        example: "mta_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
              example:
                id: "uuid-here"
                key_prefix: "mta_a1b2..."
                name: "my-app"
                active: true
                rate_limit: 200
                raw_key: "mta_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [API Keys]
      summary: List all API keys
      description: Returns all API keys (active and inactive). Raw key values are never returned.
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKey"

  /keys/{id}:
    delete:
      tags: [API Keys]
      summary: Revoke an API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Key revoked
          content:
            application/json:
              example:
                message: "API key revoked"
        "404":
          description: Key not found

  /transcripts:
    post:
      tags: [Transcripts]
      summary: Extract a YouTube transcript
      description: |
        Submits a YouTube URL for transcript extraction. Returns immediately with a `pending` status.
        Poll `GET /transcripts/{id}` to check progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
                video_id:
                  type: string
                  example: "dQw4w9WgXcQ"
            examples:
              url:
                summary: Using full URL
                value:
                  url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
              video_id:
                summary: Using video ID
                value:
                  video_id: "dQw4w9WgXcQ"
      responses:
        "202":
          description: Extraction started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcript"
        "400":
          description: Invalid URL
        "200":
          description: Transcript already exists (returned cached)
    get:
      tags: [Transcripts]
      summary: List transcripts
      description: Returns a paginated list of transcripts with optional filtering.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, failed]
        - name: search
          in: query
          schema:
            type: string
          description: Search in title and channel name
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at, title, word_count, duration]
            default: created_at
        - name: sort_dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Paginated transcript list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTranscripts"

  /transcripts/{id}:
    get:
      tags: [Transcripts]
      summary: Get a transcript
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transcript found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcript"
        "404":
          description: Not found
    delete:
      tags: [Transcripts]
      summary: Delete a transcript
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {"200": {description: Transcript deleted}, "404": {description: Not found}}

  /transcripts/{id}/export:
    get:
      tags: [Transcripts]
      summary: Export transcript in various formats
      description: |
        Downloads the transcript in the specified format.
        Only works for completed transcripts.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [txt, md, srt, json]
            default: txt
          description: |
            - `txt` -- Plain text
            - `md` -- Markdown with metadata header
            - `srt` -- SubRip subtitle format (approximate timestamps)
            - `json` -- Full JSON with all metadata
      responses:
        "200":
          description: File download
          headers:
            Content-Disposition:
              schema:
                type: string
              example: 'attachment; filename="Video Title.txt"'
          content:
            text/plain:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
            text/srt:
              schema:
                type: string
            application/json:
              schema:
                type: object
        "400":
          description: Invalid format
        "404":
          description: Transcript not found or not completed

  /transcripts/{id}/summaries:
    get:
      tags: [Summaries]
      summary: Get summaries for a transcript
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Summary"

  /transcripts/{id}/chat:
    get:
      tags: [Transcripts]
      summary: Get chat history for a transcript
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chat session and messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "404":
          description: Transcript not found
        "409":
          description: Transcript not ready

    post:
      tags: [Transcripts]
      summary: Send a chat message about a transcript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  example: "What are the main takeaways?"
                model:
                  type: string
                  description: Optional model override
                  example: "openai/gpt-4o-mini"
      responses:
        "200":
          description: User + assistant messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "404":
          description: Transcript not found
        "409":
          description: Transcript not ready

  /audio/transcriptions/{id}/chat:
    get:
      tags: [Audio]
      summary: Get chat history for an audio transcription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chat session and messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "404":
          description: Audio transcription not found
        "409":
          description: Audio transcription not ready

    post:
      tags: [Audio]
      summary: Send a chat message about an audio transcription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  example: "Summarize the key takeaways."
                model:
                  type: string
                  description: Optional model override
                  example: "anthropic/claude-4.5-opus-20251124"
      responses:
        "200":
          description: User + assistant messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "404":
          description: Audio transcription not found
        "409":
          description: Audio transcription not ready

  /pdf/extractions/{id}/chat:
    get:
      tags: [PDF]
      summary: Get chat history for a PDF extraction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chat session and messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "404":
          description: PDF extraction not found
        "409":
          description: PDF extraction not ready

    post:
      tags: [PDF]
      summary: Send a chat message about a PDF extraction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  example: "What are the main points in this document?"
                model:
                  type: string
                  description: Optional model override
                  example: "anthropic/claude-4.5-opus-20251124"
      responses:
        "200":
          description: User + assistant messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "404":
          description: PDF extraction not found
        "409":
          description: PDF extraction not ready

  /transcripts/batch:
    post:
      tags: [Batch Processing]
      summary: Submit multiple URLs for batch processing
      description: |
        Accepts up to 10 YouTube URLs for parallel transcript extraction.
        Returns a batch ID to track overall progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                  example:
                    - "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
                    - "https://www.youtube.com/watch?v=9bZkp7q19f0"
            example:
              urls:
                - "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
                - "https://www.youtube.com/watch?v=9bZkp7q19f0"
      responses:
        "202":
          description: Batch created and processing started
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch:
                    $ref: "#/components/schemas/Batch"
                  transcripts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transcript"
        "400":
          description: Invalid request (bad URLs or too many)

  /batches/{id}:
    get:
      tags: [Batch Processing]
      summary: Get batch status
      description: Returns the batch progress and all associated transcripts.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Batch status with transcripts
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch:
                    $ref: "#/components/schemas/Batch"
                  transcripts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transcript"
        "404":
          description: Batch not found

  /summaries:
    post:
      tags: [Summaries]
      summary: Generate an AI summary
      description: |
        Generates an AI-powered summary for a completed transcript.
        Processing happens asynchronously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transcript_id]
              properties:
                transcript_id:
                  type: string
                  format: uuid
                length:
                  type: string
                  enum: [short, medium, detailed]
                  default: medium
                style:
                  type: string
                  enum: [bullet, narrative, academic]
                  default: bullet
                model:
                  type: string
                  description: Override the default AI model
                  example: "openai/gpt-4o"
      responses:
        "202":
          description: Summary generation started
          content:
            application/json:
              example:
                message: "Summary generation started"
                summary_id: "uuid-here"
                transcript_id: "uuid-here"
                length: "medium"
                style: "bullet"
        "404":
          description: Transcript not found
        "409":
          description: Transcript not yet completed

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a legacy user when legacy auth is enabled
      security: []
      responses: {"201": {description: User registered}, "404": {description: Legacy auth disabled}}
  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in with legacy credentials when enabled
      security: []
      responses: {"200": {description: Auth token}, "401": {description: Invalid credentials}}
  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the signed-in user
      responses: {"200": {description: Current user}}
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh a legacy auth token when enabled
      responses: {"200": {description: Refreshed token}}
  /workspace:
    get:
      tags: [Workspace]
      summary: List legacy workspace bookmarks
      responses: {"200": {description: Workspace items}}
    post:
      tags: [Workspace]
      summary: Save a legacy workspace bookmark
      responses: {"201": {description: Item saved}}
  /workspace/{type}/{id}:
    delete:
      tags: [Workspace]
      summary: Remove a legacy workspace bookmark
      parameters:
        - {name: type, in: path, required: true, schema: {type: string}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {"200": {description: Item removed}}
  /user/keys:
    post:
      tags: [API Keys]
      summary: Create an account-owned developer key
      responses: {"201": {description: API key created}}
  /audio/transcribe:
    post:
      tags: [Audio]
      summary: Upload audio for asynchronous transcription
      responses: {"202": {description: Transcription queued}}
  /audio/uploads/presign:
    post:
      tags: [Audio]
      summary: Create a direct-to-storage audio upload
      responses: {"200": {description: Presigned upload}}
  /audio/uploads/complete:
    post:
      tags: [Audio]
      summary: Complete a direct audio upload and queue transcription
      responses: {"202": {description: Transcription queued}}
  /audio/transcriptions:
    get:
      tags: [Audio]
      summary: List audio transcriptions
      responses: {"200": {description: Audio transcriptions}}
  /audio/transcriptions/search:
    get:
      tags: [Audio]
      summary: Search audio transcriptions
      responses: {"200": {description: Matching audio transcriptions}}
  /audio/transcriptions/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Audio]
      summary: Get an audio transcription
      responses: {"200": {description: Audio transcription}, "404": {description: Not found}}
    patch:
      tags: [Audio]
      summary: Rename an audio transcription
      responses: {"200": {description: Audio transcription updated}}
    delete:
      tags: [Audio]
      summary: Delete an audio transcription
      responses: {"200": {description: Audio transcription deleted}}
  /audio/transcriptions/{id}/cancel:
    post:
      tags: [Audio]
      summary: Cancel an active audio transcription
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Transcription canceled}}
  /audio/transcriptions/{id}/retry:
    post:
      tags: [Audio]
      summary: Retry an audio transcription
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"202": {description: Transcription queued}}
  /audio/transcriptions/{id}/audio:
    get:
      tags: [Audio]
      summary: Get a short-lived audio playback URL
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Playback URL}}
  /audio/transcriptions/{id}/export:
    get:
      tags: [Audio]
      summary: Export an audio transcription
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Export file}}
  /audio/transcriptions/{id}/summarize:
    post:
      tags: [Audio]
      summary: Generate an audio summary
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Audio summary}}
  /pdf/extract:
    post:
      tags: [PDF]
      summary: Upload and extract text from a PDF
      responses: {"200": {description: PDF extraction}}
  /pdf/extractions:
    get:
      tags: [PDF]
      summary: List PDF extractions
      responses: {"200": {description: PDF extractions}}
  /pdf/extractions/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [PDF]
      summary: Get a PDF extraction
      responses: {"200": {description: PDF extraction}}
    delete:
      tags: [PDF]
      summary: Delete a PDF extraction
      responses: {"200": {description: PDF extraction deleted}}
  /collections:
    get:
      tags: [Collections]
      summary: List collections
      responses: {"200": {description: Collections}}
    post:
      tags: [Collections]
      summary: Create a collection
      responses: {"201": {description: Collection created}}
  /collections/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Collections]
      summary: Get a collection and its items
      responses: {"200": {description: Collection}}
    patch:
      tags: [Collections]
      summary: Update a collection
      responses: {"200": {description: Collection updated}}
    delete:
      tags: [Collections]
      summary: Delete a collection
      responses: {"200": {description: Collection deleted}}
  /collections/{id}/items:
    post:
      tags: [Collections]
      summary: Add items to a collection
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Items added}}
  /collections/{id}/items/{itemId}:
    delete:
      tags: [Collections]
      summary: Remove an item from a collection
