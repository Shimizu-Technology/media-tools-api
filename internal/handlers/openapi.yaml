openapi: "3.0.3"
info:
  title: Media Tools API
  description: |
    A Go-powered media workspace API for video transcripts, recording transcription,
    PDF extraction, collections, chat, webhooks, and AI summaries.

    ## Authentication
    Protected endpoints accept an `X-API-Key` header or an enabled bearer
    provider. First-party access tokens are the durable account credential.
    Clerk is an optional migration bridge. Legacy HS256 bearer tokens are
    accepted only while `LEGACY_AUTH_ENABLED=true`.

    ## Rate Limiting
    Each API key has a per-hour rate limit (default: 100 requests/hour).
    Signed-in browser users have separate read and mutation budgets so progress
    checks cannot block job actions. Check `X-RateLimit-Limit` and
    `X-RateLimit-Remaining`; 429 responses also include `Retry-After` seconds.

    ## Request tracing
    Every response includes `X-Request-ID`. Clients may send a safe `X-Request-ID`
    value to correlate one operation across client and server logs; otherwise the
    API generates one. Query strings, bodies, and authentication headers are not
    written to access logs.
  version: "1.0.0"
  contact:
    name: Shimizu Technology
    url: https://github.com/Shimizu-Technology/media-tools-api

servers:
  - url: /api/v1
    description: API v1

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication. Create one via POST /api/v1/keys.
    BearerAuth:
      type: http
      scheme: bearer
      description: First-party access token, optional migration-only Clerk session JWT, or explicitly enabled legacy token.

  schemas:
    Transcript:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        youtube_url:
          type: string
          example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        youtube_id:
          type: string
          example: "dQw4w9WgXcQ"
        title:
          type: string
          example: "Never Gonna Give You Up"
        channel_name:
          type: string
          example: "Rick Astley"
        duration:
          type: integer
          description: Duration in seconds
          example: 212
        language:
          type: string
          example: "en"
        transcript_text:
          type: string
          example: "We're no strangers to love..."
        word_count:
          type: integer
          example: 1543
        status:
          type: string
          enum: [pending, processing, completed, failed]
          example: "completed"
        error_message:
          type: string
          example: ""
        batch_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Summary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transcript_id:
          type: string
          format: uuid
        model_used:
          type: string
          example: "openai/gpt-4o-mini"
        summary_text:
          type: string
        key_points:
          type: array
          items:
            type: string
        evidence:
          $ref: "#/components/schemas/SummaryEvidence"
        length:
          type: string
          enum: [short, medium, detailed]
        style:
          type: string
          enum: [bullet, narrative, academic]
        status:
          type: string
          enum: [pending, processing, completed, failed]
        error_message:
          type: string
        created_at:
          type: string
          format: date-time

    ChatSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transcript_id:
          type: string
          format: uuid
          nullable: true
        item_type:
          type: string
          enum: [transcript, audio, pdf, collection]
        item_id:
          type: string
          format: uuid
        api_key_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChatMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        model_used:
          type: string
          example: "openai/gpt-4o-mini"
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        created_at:
          type: string
          format: date-time

    ChatResponse:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/ChatSession"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"

    AIContentReport:
      type: object
      properties:
        id: {type: string, format: uuid}
        target_type:
          type: string
          enum: [chat_message, transcript_summary, audio_summary]
        target_id: {type: string, format: uuid}
        subject_type:
          type: string
          enum: [transcript, audio, pdf, collection]
        subject_id: {type: string, format: uuid}
        category:
          type: string
          enum: [dangerous, hate_or_harassment, sexual, privacy, deceptive, other]
        details: {type: string, maxLength: 1000}
        content_snapshot:
          type: object
          additionalProperties: true
          description: Selected AI output only; no separate source content is attached.
        status:
          type: string
          enum: [open, reviewing, resolved, dismissed]
        admin_note: {type: string, maxLength: 1000}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    Citation:
      type: object
      required: [segment_id, item_type, item_id]
      properties:
        segment_id: {type: string}
        item_type: {type: string, enum: [transcript, audio, pdf]}
        item_id: {type: string, format: uuid}
        item_title: {type: string}
        start_ms: {type: integer, format: int64, nullable: true}
        end_ms: {type: integer, format: int64, nullable: true}
        page_number: {type: integer, nullable: true}

    SummaryEvidence:
      type: object
      properties:
        summary:
          type: array
          items: {$ref: "#/components/schemas/Citation"}
        key_points:
          type: array
          items:
            type: array
            items: {$ref: "#/components/schemas/Citation"}
        action_items:
          type: array
          items:
            type: array
            items: {$ref: "#/components/schemas/Citation"}
        decisions:
          type: array
          items:
            type: array
            items: {$ref: "#/components/schemas/Citation"}
        topics:
          type: array
          items:
            type: array
            items: {$ref: "#/components/schemas/Citation"}

    MediaSegment:
      type: object
      required: [id, item_type, item_id, ordinal, text]
      properties:
        id: {type: string, format: uuid}
        item_type: {type: string, enum: [transcript, audio, pdf]}
        item_id: {type: string, format: uuid}
        ordinal: {type: integer}
        start_ms: {type: integer, format: int64, nullable: true}
        end_ms: {type: integer, format: int64, nullable: true}
        page_number: {type: integer, nullable: true}
        text: {type: string}
        created_at: {type: string, format: date-time}

    Batch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, processing, completed, failed]
        total_count:
          type: integer
          example: 5
        completed_count:
          type: integer
          example: 3
        failed_count:
          type: integer
          example: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    APIKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key_prefix:
          type: string
          example: "mta_a1b2..."
        name:
          type: string
          example: "my-app"
        active:
          type: boolean
        rate_limit:
          type: integer
          example: 100
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: integer

    PaginatedTranscripts:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Transcript"
        page:
          type: integer
        per_page:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        version:
          type: string
          example: "1.0.0"
        database:
          type: string
          enum: [unchecked, healthy, unhealthy]
          example: "unchecked"
        workers:
          type: integer
          example: 3
        yt_dlp_cookies_configured:
          type: boolean
          example: true

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      description: Returns process health without querying the database. Safe for frequent infrastructure probes.
      security: []
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: "ok"
                version: "1.0.0"
                database: "unchecked"
                workers: 3
                yt_dlp_cookies_configured: true

  /ready:
    get:
      tags: [Health]
      summary: Readiness check
      description: Checks database connectivity for explicit diagnostics. Do not use as a high-frequency infrastructure probe.
      security: []
      responses:
        "200":
          description: API and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /keys:
    post:
      tags: [API Keys]
      summary: Create a new API key
      description: |
        Generates a new API key. The raw key is only shown once in the response -- save it!
        In production this endpoint requires `X-Admin-Key`; in local development it can be left open for bootstrapping.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "my-app"
                rate_limit:
                  type: integer
                  example: 200
                  description: Requests per hour (default 100)
            example:
              name: "my-app"
              rate_limit: 200
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIKey"
                  - type: object
                    properties:
                      raw_key:
                        type: string
                        example: "mta_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
              example:
                id: "uuid-here"
                key_prefix: "mta_a1b2..."
                name: "my-app"
                active: true
                rate_limit: 200
                raw_key: "mta_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [API Keys]
      summary: List all API keys
      description: Returns all API keys (active and inactive). Raw key values are never returned.
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKey"

  /keys/{id}:
    delete:
      tags: [API Keys]
      summary: Revoke an API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Key revoked
          content:
            application/json:
              example:
                message: "API key revoked"
        "404":
          description: Key not found

  /transcripts:
    post:
      tags: [Transcripts]
      summary: Extract a YouTube transcript
      description: |
        Submits a YouTube URL for transcript extraction. Returns immediately with a `pending` status.
        Poll `GET /transcripts/{id}` to check progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
                video_id:
                  type: string
                  example: "dQw4w9WgXcQ"
            examples:
              url:
                summary: Using full URL
                value:
                  url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
              video_id:
                summary: Using video ID
                value:
                  video_id: "dQw4w9WgXcQ"
      responses:
        "202":
          description: Extraction started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcript"
        "400":
          description: Invalid URL
        "200":
          description: Transcript already exists (returned cached)
    get:
      tags: [Transcripts]
      summary: List transcripts
      description: Returns a paginated list of transcripts with optional filtering.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, failed]
        - name: search
          in: query
          schema:
            type: string
          description: Search in title and channel name
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at, title, word_count, duration]
            default: created_at
        - name: sort_dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Paginated transcript list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTranscripts"

  /transcripts/{id}:
    get:
      tags: [Transcripts]
      summary: Get a transcript
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transcript found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcript"
        "404":
          description: Not found
    delete:
      tags: [Transcripts]
      summary: Delete a transcript
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {"200": {description: Transcript deleted}, "404": {description: Not found}}

  /transcripts/{id}/export:
    get:
      tags: [Transcripts]
      summary: Export transcript in various formats
      description: |
        Downloads the transcript in the specified format.
        Only works for completed transcripts.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [txt, md, srt, json]
            default: txt
          description: |
            - `txt` -- Plain text
            - `md` -- Markdown with metadata header
            - `srt` -- SubRip subtitle format (approximate timestamps)
            - `json` -- Full JSON with all metadata
      responses:
        "200":
          description: File download
          headers:
            Content-Disposition:
              schema:
                type: string
              example: 'attachment; filename="Video Title.txt"'
          content:
            text/plain:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
            text/srt:
              schema:
                type: string
            application/json:
              schema:
                type: object
        "400":
          description: Invalid format
        "404":
          description: Transcript not found or not completed

  /transcripts/{id}/summaries:
    get:
      tags: [Summaries]
      summary: Get summaries for a transcript
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Summary"

  /transcripts/{id}/chat:
    get:
      tags: [Transcripts]
      summary: Get chat history for a transcript
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chat session and messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "404":
          description: Transcript not found
        "409":
          description: Transcript not ready

    post:
      tags: [Transcripts]
      summary: Send a chat message about a transcript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  example: "What are the main takeaways?"
                model:
                  type: string
                  description: Optional model override
                  example: "openai/gpt-4o-mini"
      responses:
        "200":
          description: User + assistant messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "404":
          description: Transcript not found
        "409":
          description: Transcript not ready

  /audio/transcriptions/{id}/chat:
    get:
      tags: [Audio]
      summary: Get chat history for an audio transcription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chat session and messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "404":
          description: Audio transcription not found
        "409":
          description: Audio transcription not ready

    post:
      tags: [Audio]
      summary: Send a chat message about an audio transcription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  example: "Summarize the key takeaways."
                model:
                  type: string
                  description: Optional model override
                  example: "anthropic/claude-4.5-opus-20251124"
      responses:
        "200":
          description: User + assistant messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "404":
          description: Audio transcription not found
        "409":
          description: Audio transcription not ready

  /pdf/extractions/{id}/chat:
    get:
      tags: [PDF]
      summary: Get chat history for a PDF extraction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chat session and messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "404":
          description: PDF extraction not found
        "409":
          description: PDF extraction not ready

    post:
      tags: [PDF]
      summary: Send a chat message about a PDF extraction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  example: "What are the main points in this document?"
                model:
                  type: string
                  description: Optional model override
                  example: "anthropic/claude-4.5-opus-20251124"
      responses:
        "200":
          description: User + assistant messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "404":
          description: PDF extraction not found
        "409":
          description: PDF extraction not ready

  /transcripts/batch:
    post:
      tags: [Batch Processing]
      summary: Submit multiple URLs for batch processing
      description: |
        Accepts up to 10 YouTube URLs for parallel transcript extraction.
        Returns a batch ID to track overall progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                  example:
                    - "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
                    - "https://www.youtube.com/watch?v=9bZkp7q19f0"
            example:
              urls:
                - "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
                - "https://www.youtube.com/watch?v=9bZkp7q19f0"
      responses:
        "202":
          description: Batch created and processing started
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch:
                    $ref: "#/components/schemas/Batch"
                  transcripts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transcript"
        "400":
          description: Invalid request (bad URLs or too many)

  /batches/{id}:
    get:
      tags: [Batch Processing]
      summary: Get batch status
      description: Returns the batch progress and all associated transcripts.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Batch status with transcripts
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch:
                    $ref: "#/components/schemas/Batch"
                  transcripts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transcript"
        "404":
          description: Batch not found

  /summaries:
    post:
      tags: [Summaries]
      summary: Generate an AI summary
      description: |
        Generates an AI-powered summary for a completed transcript.
        Processing happens asynchronously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transcript_id]
              properties:
                transcript_id:
                  type: string
                  format: uuid
                length:
                  type: string
                  enum: [short, medium, detailed]
                  default: medium
                style:
                  type: string
                  enum: [bullet, narrative, academic]
                  default: bullet
                model:
                  type: string
                  description: Override the default AI model
                  example: "openai/gpt-4o"
      responses:
        "202":
          description: Summary generation started
          content:
            application/json:
              example:
                message: "Summary generation started"
                summary_id: "uuid-here"
                transcript_id: "uuid-here"
                length: "medium"
                style: "bullet"
        "404":
          description: Transcript not found
        "409":
          description: Transcript not yet completed

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a legacy user when legacy auth is enabled
      security: []
      responses: {"201": {description: User registered}, "404": {description: Legacy auth disabled}}
  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in with legacy credentials when enabled
      security: []
      responses: {"200": {description: Auth token}, "401": {description: Invalid credentials}}
  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the signed-in user
      responses: {"200": {description: Current user}}
  /auth/session/bootstrap:
    post:
      tags: [Authentication]
      summary: Bootstrap a recoverable native first-party session
      description: |
        Requires a current Clerk bearer identity for an existing account. iOS
        and Android clients must generate and durably save next_refresh_token
        before sending this request. An exact retry recovers the same session
        with a fresh access token while that session and refresh credential
        remain active, including after a lost HTTP response or delayed app
        relaunch. Raw web clients are rejected; browsers use the HttpOnly
        same-origin cookie session endpoints.
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_type, next_refresh_token]
              properties:
                client_type: {type: string, enum: [ios, android]}
                device_name: {type: string, maxLength: 80}
                next_refresh_token: {type: string, description: Client-generated mta_rt_ credential saved before sending}
      responses:
        "201": {description: New or exactly recovered first-party session credentials}
        "400": {description: Invalid, unavailable, or browser successor credential}
        "401": {description: Current Clerk identity required}
  /auth/invitations:
    post:
      tags: [Authentication]
      summary: Create a one-time account invitation
      description: Requires the configured X-Admin-Key. The token is returned once for manual sharing. Creating another invitation for the same email revokes every older unused link.
      security: []
      responses: {"201": {description: Invitation created}, "409": {description: Email already belongs to an account}}
  /auth/invitations/redeem:
    post:
      tags: [Authentication]
      summary: Redeem an invitation from a native client
      security: []
      description: |
        iOS and Android clients must generate and durably save next_refresh_token
        before this request. An exact token and successor retry can recover the
        same session for 24 hours after a lost response. Raw web redemption is
        rejected; browser clients use the cookie endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, client_type, next_refresh_token]
              properties:
                token: {type: string}
                client_type: {type: string, enum: [ios, android]}
                device_name: {type: string, maxLength: 80}
                next_refresh_token: {type: string, description: Client-generated mta_rt_ credential saved before sending}
      responses: {"201": {description: First-party session credentials}, "401": {description: Invalid, expired, or mismatched invitation retry}}
  /auth/onboarding/reissues:
    post:
      tags: [Authentication]
      summary: Reissue onboarding access for a stranded account
      description: |
        Requires the configured X-Admin-Key and an immutable users.id. The
        account must have no passkey and no active unused recovery code. A new
        link revokes older unused rescue links for the same account. The token
        and fragment URL are returned once for manual secure sharing.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: {type: string, format: uuid}
      responses:
        "201": {description: One-time onboarding rescue created}
        "404": {description: Account not found}
        "409": {description: Account already has a sign-in recovery method}
  /auth/onboarding/reissues/redeem:
    post:
      tags: [Authentication]
      summary: Redeem onboarding rescue from a native client
      security: []
      description: |
        iOS and Android clients save next_refresh_token before sending this
        request. Redemption creates one session and atomically revokes every
        older device session for the account. An exact token and successor
        retry can recover a lost successful response for 24 hours. Raw web
        redemption is rejected; browsers use the cookie onboarding adapter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, client_type, next_refresh_token]
              properties:
                token: {type: string}
                client_type: {type: string, enum: [ios, android]}
                device_name: {type: string, maxLength: 80}
                next_refresh_token: {type: string, description: Client-generated mta_rt_ credential saved before sending}
      responses:
        "201": {description: First-party session credentials}
        "401": {description: Invalid, expired, revoked, or mismatched rescue retry}
        "409": {description: Account gained a sign-in recovery method before redemption}
  /auth/recovery:
    get:
      tags: [Authentication]
      summary: Count unused recovery codes
      description: Returns only unused codes in the active confirmed set. Pending replacement sets are excluded.
      security: [{BearerAuth: []}]
      responses: {"200": {description: Remaining recovery code count}}
  /auth/recovery/rotation/begin:
    post:
      tags: [Authentication]
      summary: Begin a safe recovery-code rotation
      description: |
        Requires an authenticated first-party device session. Creates ten new
        codes in an inactive pending set that expires after 24 hours. The
        current active codes remain usable until the pending set is confirmed.
        Starting again replaces any unconfirmed pending set, which lets a client
        recover from losing the begin response by saving a newly returned set.
        Plaintext codes are returned only in this response and are never stored.
      security: [{BearerAuth: []}]
      responses:
        "201":
          description: Pending recovery-code rotation
          content:
            application/json:
              schema:
                type: object
                required: [rotation_id, codes]
                properties:
                  rotation_id: {type: string, format: uuid}
                  codes:
                    type: array
                    minItems: 10
                    maxItems: 10
                    items: {type: string}
  /auth/recovery/rotation/confirm:
    post:
      tags: [Authentication]
      summary: Activate a saved recovery-code set
      description: |
        Requires the same account's authenticated first-party device session.
        Atomically activates the pending set and invalidates the old active set.
        Repeating confirmation for the still-active rotation is idempotent and
        reports its current unused count. Expired, replaced, foreign, and
        superseded rotation IDs all return the same generic response.
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rotation_id]
              properties:
                rotation_id: {type: string, format: uuid}
      responses:
        "200":
          description: Pending set is active
          content:
            application/json:
              schema:
                type: object
                required: [remaining]
                properties:
                  remaining: {type: integer, minimum: 0, maximum: 10}
        "404": {description: Invalid or expired rotation}
  /auth/recovery/redeem:
    post:
      tags: [Authentication]
      summary: Redeem a recovery code from a native client
      security: []
      description: |
        iOS and Android clients must generate and durably save next_refresh_token
        before this request. An exact code and successor retry can recover the
        same session for 24 hours after a lost response. Rotating recovery codes
        invalidates any retry record. Raw web redemption is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, client_type, next_refresh_token]
              properties:
                code: {type: string}
                client_type: {type: string, enum: [ios, android]}
                device_name: {type: string, maxLength: 80}
                next_refresh_token: {type: string, description: Client-generated mta_rt_ credential saved before sending}
      responses: {"201": {description: First-party session credentials}, "401": {description: Invalid, used, expired, or mismatched recovery retry}}
  /auth/clerk-detachment:
    get:
      tags: [Authentication]
      summary: Check whether an account can disconnect Clerk
      description: |
        Requires a valid first-party device session. Reports only factor counts
        and link state. A linked account is ready after it has at least one
        passkey and one active unused recovery code.
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Clerk link and first-party recovery readiness}
        "401": {description: A first-party device session is required}
    post:
      tags: [Authentication]
      summary: Disconnect the legacy Clerk identity
      description: |
        Requires a valid first-party device session. Atomically clears the
        legacy users.clerk_id and removes Clerk auth-identity rows only after a
        passkey and an active unused recovery code exist. User data, API keys,
        and device sessions are preserved. Repeating a successful request is
        idempotent.
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Clerk is disconnected or was already disconnected}
        "401": {description: A first-party device session is required}
        "409": {description: A passkey and unused recovery code are required}
  /auth/passkeys:
    get:
      tags: [Authentication]
      summary: Count registered passkeys for the signed-in account
      security: [{BearerAuth: []}]
      responses:
        "200":
          description: Registered passkey count
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: {type: integer, minimum: 0}
  /auth/passkeys/register/begin:
    post:
      tags: [Authentication]
      summary: Begin passkey enrollment for the signed-in account
      description: |
        Requires a verified Clerk session JWT with a session ID or a first-party
        access token. Legacy JWTs and API keys cannot enroll a passkey. The
        first-party auth feature flag must be enabled. The relying-party ID is
        media.shimizu-technology.com and user verification is required.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: One-use registration ceremony and WebAuthn creation options
          content:
            application/json:
              schema:
                type: object
                required: [ceremony_id, options]
                properties:
                  ceremony_id: {type: string, format: uuid}
                  options: {type: object, description: PublicKeyCredentialCreationOptions with binary members encoded as unpadded base64url}
        "401": {description: No eligible signed-in session}
  /auth/passkeys/register/finish:
    post:
      tags: [Authentication]
      summary: Verify and save a passkey for the signed-in account
      description: |
        Uses the same account and session as begin. The ceremony is consumed
        once, even when verification fails. Binary credential response fields
        must be encoded as unpadded base64url strings.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony_id, credential]
              properties:
                ceremony_id: {type: string, format: uuid}
                credential: {type: object, description: WebAuthn PublicKeyCredential registration JSON}
      responses:
        "201": {description: Passkey saved; returns credential_id as unpadded base64url}
        "401": {description: Session, challenge, or passkey verification failed}
        "409": {description: Credential is already registered}
  /auth/passkeys/login/begin:
    post:
      tags: [Authentication]
      summary: Begin discoverable passkey sign-in
      security: []
      description: Public endpoint. Requires a discoverable passkey and user verification. Rate limited by network peer.
      responses:
        "200":
          description: One-use login ceremony and WebAuthn request options
          content:
            application/json:
              schema:
                type: object
                required: [ceremony_id, options]
                properties:
                  ceremony_id: {type: string, format: uuid}
                  options: {type: object, description: PublicKeyCredentialRequestOptions with binary members encoded as unpadded base64url}
        "429": {description: Too many attempts}
  /auth/passkeys/login/finish:
    post:
      tags: [Authentication]
      summary: Verify a passkey and create a revocable first-party device session
      security: []
      description: |
        The ceremony is consumed once even when verification fails. iOS and
        Android clients must generate and durably save next_refresh_token before
        the first request. After successful verification, an exact ceremony and
        successor retry can recover the same session for 24 hours; credential
        may be omitted on that retry. Raw web token responses are rejected.
        Rate limited by network peer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony_id, client_type, next_refresh_token]
              properties:
                ceremony_id: {type: string, format: uuid}
                credential: {type: object, description: WebAuthn PublicKeyCredential assertion JSON with unpadded base64url binary fields}
                client_type: {type: string, enum: [ios, android]}
                device_name: {type: string, maxLength: 80}
                next_refresh_token: {type: string, description: Client-generated mta_rt_ credential saved before sending}
      responses:
        "201": {description: First-party access token, refresh token, and session metadata; store securely}
        "401": {description: Challenge or passkey verification failed}
        "429": {description: Too many attempts}
  /auth/web/session/bootstrap/prepare:
    post:
      tags: [Authentication]
      summary: Prepare a response-loss-safe Clerk-to-cookie session exchange
      security: []
      description: |
        Requires an exact allowed Origin. Installs a host-only HttpOnly refresh
        successor and a readable CSRF cookie before the authenticated commit.
        No credential is returned to JavaScript.
      responses:
        "204": {description: Successor and CSRF cookies installed}
        "403": {description: Origin is not allowed}
  /auth/web/session/bootstrap:
    post:
      tags: [Authentication]
      summary: Exchange a verified Clerk identity for browser cookies
      security: [{BearerAuth: []}]
      parameters:
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      description: |
        Requires the prepared HttpOnly successor and matching CSRF cookie. An
        exact retry recovers the same recent session. The response contains
        user and expiry metadata only; access and refresh credentials are set
        as host-only HttpOnly cookies.
      responses:
        "201": {description: Browser session cookies installed}
        "400": {description: Browser sign-in was not prepared}
        "403": {description: Origin or CSRF validation failed}
  /auth/web/session/passkeys/login/begin:
    post:
      tags: [Authentication]
      summary: Begin passkey sign-in for an HttpOnly browser session
      security: []
      description: |
        Requires an exact allowed Origin. Revokes any replaced browser session,
        installs a pending HttpOnly successor and CSRF cookie, and returns a
        discoverable WebAuthn ceremony. No bearer token is exposed.
      responses:
        "200": {description: Ceremony and PublicKeyCredentialRequestOptions}
        "403": {description: Origin is not allowed}
        "429": {description: Too many attempts}
  /auth/web/session/passkeys/login/finish:
    post:
      tags: [Authentication]
      summary: Finish passkey sign-in and install HttpOnly browser cookies
      security: []
      parameters:
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony_id]
              properties:
                ceremony_id: {type: string, format: uuid}
                credential: {type: object, description: Required on the first finish; omitted for exact response-loss recovery}
      responses:
        "201": {description: Browser cookies installed; body contains metadata only}
        "401": {description: Challenge or passkey verification failed}
        "403": {description: Origin or CSRF validation failed}
        "429": {description: Too many attempts}
  /auth/web/session/recovery/prepare:
    post:
      tags: [Authentication]
      summary: Prepare recovery-code sign-in for an HttpOnly browser session
      security: []
      description: |
        Requires an exact allowed Origin. Installs a dedicated host-only
        HttpOnly refresh successor and a readable CSRF cookie without changing
        any current browser session. Repeating prepare reuses a valid pending
        successor. No credential is returned to JavaScript.
      responses:
        "204": {description: Recovery successor and CSRF cookies installed}
        "403": {description: Origin is not allowed}
        "429": {description: Too many attempts}
  /auth/web/session/recovery/finish:
    post:
      tags: [Authentication]
      summary: Redeem a recovery code and install HttpOnly browser cookies
      security: []
      parameters:
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      description: |
        Consumes the code, creates or recovers the replacement session, and
        revokes any session previously stored in this browser in one database
        transaction. The response contains metadata only. Omit code only for
        an exact response-loss retry using the prepared successor. An
        unavailable successor clears only its pending cookie so the same
        unconsumed code can be retried after prepare.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: {type: string, description: Required for first redemption; omitted for exact response-loss recovery}
      responses:
        "201": {description: Browser cookies installed; body contains metadata only}
        "400": {description: Browser sign-in needs a fresh prepare}
        "401": {description: Recovery code is invalid or already used}
        "403": {description: Origin or CSRF validation failed}
        "429": {description: Too many attempts}
  /auth/web/session/onboarding/transfer:
    post:
      tags: [Authentication]
      summary: Protect an invitation or rescue URL fragment in an HttpOnly cookie
      security: []
      description: |
        Runs before the browser application starts. Requires the exact allowed
        Origin and accepts one canonical invitation or onboarding-rescue token.
        Installs the secret and a response-loss successor in host-only Secure
        HttpOnly SameSite=Strict cookies scoped to the onboarding endpoints for
        15 minutes. A server-persisted incomplete onboarding account cannot be
        replaced by another link. No secret is returned in the response body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, token]
              properties:
                kind: {type: string, enum: [invite, onboarding]}
                token: {type: string}
      responses:
        "204": {description: Fragment secret and successor protected in cookies}
        "400": {description: Invalid link shape}
        "403": {description: Origin is not allowed}
        "409": {description: Another account setup is in progress}
  /auth/web/session/onboarding/prepare:
    post:
      tags: [Authentication]
      summary: Replace a missing or unavailable onboarding successor
      security: []
      description: Requires an exact allowed Origin and a transferred invitation or rescue cookie. The protected bearer link remains unchanged.
      responses:
        "204": {description: Successor and readable CSRF cookie installed}
        "400": {description: No protected onboarding link}
        "403": {description: Origin is not allowed}
  /auth/web/session/onboarding/commit:
    post:
      tags: [Authentication]
      summary: Atomically redeem a protected link and switch browser account
      security: []
      parameters:
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      description: |
        Creates or rescues the account, installs cookie credentials, persists
        the server-side onboarding requirement, and revokes sessions previously
        stored in this browser in one transaction. An exact secret and successor
        retry recovers a lost successful response. The body contains metadata
        only and never access or refresh credentials.
      responses:
        "201": {description: Browser cookies installed; guided setup required}
        "400": {description: A fresh successor must be prepared}
        "401": {description: Link is invalid, expired, or already used}
        "403": {description: Origin or CSRF validation failed}
        "409": {description: Invitation or rescue no longer applies}
  /auth/web/session/onboarding/status:
    get:
      tags: [Authentication]
      summary: Resume server-authoritative guided account setup
      security: []
      description: Reports only whether a protected link exists, whether the cookie session is ready, and committed passkey/recovery-code counts. Secrets and credential identifiers are never returned.
      responses:
        "200": {description: Non-secret onboarding progress}
  /auth/web/session/onboarding/complete:
    post:
      tags: [Authentication]
      summary: Complete guided setup after durable recovery factors exist
      security: []
      parameters:
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      description: Locks the account row, verifies at least one passkey and one active unused recovery code, and clears the server-persisted requirement transactionally. Repeating a completed request is safe.
      responses:
        "204": {description: Guided setup completed}
        "401": {description: Browser session is missing or expired}
        "403": {description: Origin or CSRF validation failed}
        "409": {description: Required factors are incomplete}
  /account:
    delete:
      tags: [Authentication]
      summary: Permanently delete the signed-in account and its data
      description: |
        Immediately purges account-owned database content and queues durable
        cleanup of raw audio objects and any still-linked Clerk identity. A
        detached first-party account does not require Clerk configuration.
        A second object cleanup runs after issued upload URLs expire.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  enum: [DELETE]
                deletion_receipt_token:
                  type: string
                  description: Optional unguessable client receipt used to confirm a committed deletion after a lost response
      responses:
        "202":
          description: Account deletion accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: pending}
                  requested_at: {type: string, format: date-time}
                  cleanup_after: {type: string, format: date-time}
        "400": {description: Confirmation missing or account is not Clerk-managed}
        "503": {description: Account deletion is temporarily unavailable}
  /account/deletion-status:
    post:
      tags: [Authentication]
      summary: Confirm whether an account deletion transaction committed
      description: |
        Checks an unguessable client receipt after the authenticated deletion
        response was lost. Returns no account or cleanup metadata and is
        available after the account and its sessions have been removed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deletion_receipt_token]
              properties:
                deletion_receipt_token:
                  type: string
                  pattern: '^mta_del_[A-Za-z0-9_-]{43}$'
      responses:
        "200":
          description: Receipt lookup completed
          headers:
            Cache-Control: {schema: {type: string}, description: Always no-store}
          content:
            application/json:
              schema:
                type: object
                required: [confirmed]
                properties:
                  confirmed: {type: boolean}
        "400": {description: Receipt is malformed}
        "429": {description: Too many attempts}
        "503": {description: Receipt status is temporarily unavailable}
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh a legacy auth token when enabled
      responses: {"200": {description: Refreshed token}}
  /workspace:
    get:
      tags: [Workspace]
      summary: List legacy workspace bookmarks
      responses: {"200": {description: Workspace items}}
    post:
      tags: [Workspace]
      summary: Save a legacy workspace bookmark
      responses: {"201": {description: Item saved}}
  /workspace/{type}/{id}:
    delete:
      tags: [Workspace]
      summary: Remove a legacy workspace bookmark
      parameters:
        - {name: type, in: path, required: true, schema: {type: string}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {"200": {description: Item removed}}
  /user/keys:
    post:
      tags: [API Keys]
      summary: Create an account-owned developer key
      responses: {"201": {description: API key created}}
  /audio/transcribe:
    post:
      tags: [Audio]
      summary: Upload audio for asynchronous transcription
      responses: {"202": {description: Transcription queued}}
  /audio/uploads/presign:
    post:
      tags: [Audio]
      summary: Create a direct-to-storage audio upload
      responses: {"200": {description: Presigned upload}}
  /audio/uploads/complete:
    post:
      tags: [Audio]
      summary: Complete a direct audio upload and queue transcription
      responses: {"202": {description: Transcription queued}}
  /audio/transcriptions:
    get:
      tags: [Audio]
      summary: List audio transcriptions
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by status; use active for pending and processing jobs
          schema: {type: string, enum: [active, pending, processing, completed, failed]}
      responses: {"200": {description: Audio transcriptions}}
  /audio/transcriptions/search:
    get:
      tags: [Audio]
      summary: Search audio transcriptions
      responses: {"200": {description: Matching audio transcriptions}}
  /audio/transcriptions/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Audio]
      summary: Get an audio transcription
      responses: {"200": {description: Audio transcription}, "404": {description: Not found}}
    patch:
      tags: [Audio]
      summary: Rename an audio transcription
      responses: {"200": {description: Audio transcription updated}}
    delete:
      tags: [Audio]
      summary: Delete an audio transcription
      responses: {"200": {description: Audio transcription deleted}}
  /audio/transcriptions/{id}/cancel:
    post:
      tags: [Audio]
      summary: Cancel an active audio transcription
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Transcription canceled}}
  /audio/transcriptions/{id}/retry:
    post:
      tags: [Audio]
      summary: Retry an audio transcription
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"202": {description: Transcription queued}}
  /audio/transcriptions/{id}/format:
    post:
      tags: [Audio]
      summary: Format a completed transcript for readability
      description: Queues a durable, word-preserving capitalization, punctuation, and paragraph pass while retaining the original transcript.
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "202": {description: Readability formatting queued}
        "404": {description: Audio transcription not found}
        "409": {description: Transcript is not ready or formatting is already active}
  /audio/transcriptions/{id}/audio:
    get:
      tags: [Audio]
      summary: Get a short-lived audio playback URL
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Playback URL}}
  /audio/transcriptions/{id}/export:
    get:
      tags: [Audio]
      summary: Export an audio transcription
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: source, in: query, required: false, schema: {type: string, enum: [readable, original], default: readable}}
      responses: {"200": {description: Export file}}
  /audio/transcriptions/{id}/summarize:
    post:
      tags: [Audio]
      summary: Queue an audio summary
      description: Returns immediately while evidence-grounded summarization continues in the durable background queue.
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"202": {description: Audio summary queued}}
  /pdf/extract:
    post:
      tags: [PDF]
      summary: Upload and extract text from a PDF
      responses: {"200": {description: PDF extraction}}
  /pdf/extractions:
    get:
      tags: [PDF]
      summary: List PDF extractions
      responses: {"200": {description: PDF extractions}}
  /pdf/extractions/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [PDF]
      summary: Get a PDF extraction
      responses: {"200": {description: PDF extraction}}
    delete:
      tags: [PDF]
      summary: Delete a PDF extraction
      responses: {"200": {description: PDF extraction deleted}}
  /collections:
    get:
      tags: [Collections]
      summary: List collections
      responses: {"200": {description: Collections}}
    post:
      tags: [Collections]
      summary: Create a collection
      responses: {"201": {description: Collection created}}
  /collections/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Collections]
      summary: Get a collection and its items
      responses: {"200": {description: Collection}}
    patch:
      tags: [Collections]
      summary: Update a collection
      responses: {"200": {description: Collection updated}}
    delete:
      tags: [Collections]
      summary: Delete a collection
      responses: {"200": {description: Collection deleted}}
  /collections/{id}/items:
    post:
      tags: [Collections]
      summary: Add items to a collection
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Items added}}
  /collections/{id}/items/{itemId}:
    delete:
      tags: [Collections]
