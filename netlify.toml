[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# _redirects runs first. It retains domain/SEO rules but no API or SPA catch-all.
# Runtime-scoped secret is injected by Netlify, never included in the bundle.
[[redirects]]
  from = "/api/*"
  to = "https://media-tools-api.onrender.com/api/:splat"
  status = 200
  force = true
  signed = "NETLIFY_PROXY_SIGNATURE_SECRET"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for the served app. The API keeps its own policy.
# - style-src-attr: components set inline style attributes.
# - connect-src amazonaws.com: audio uploads PUT straight to a presigned S3 URL
#   (the app falls back to the API on any failure, so a missing origin here would
#   silently push large files through the Netlify proxy instead).
# - frame-src youtube.com: the source-video player on transcript pages.
# No Clerk origins: the web app no longer loads Clerk.
# No font origins: type uses the system rounded and system sans fonts.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: https://*.amazonaws.com; connect-src 'self' https://*.amazonaws.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
